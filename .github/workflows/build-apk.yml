name: build-apk
on:
  push:
    tags: ['v*']
    branches: ['main','master']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2
          npx cap init "CPNS Tryout 2026" com.chukie99.cpnstryout --web-dir www || true
      - name: Add Android
        run: |
          npx cap add android || true
          npx cap copy android || true
          npx cap sync android || true
      - name: Install Pillow
        run: pip install Pillow
      - name: Apply custom icon
        run: |
          python3 - << 'PY'
          from PIL import Image
          import pathlib
          src = pathlib.Path("www/icon.png")
          if not src.exists():
              src = pathlib.Path("icon.png")
          if src.exists():
              img = Image.open(src)
              for px, dpi in [(48,"mdpi"),(72,"hdpi"),(96,"xhdpi"),(144,"xxhdpi"),(192,"xxxhdpi")]:
                  out = pathlib.Path(f"android/app/src/main/res/mipmap-{dpi}/ic_launcher.png")
                  out.parent.mkdir(parents=True, exist_ok=True)
                  im = img.resize((px,px), Image.LANCZOS)
                  im.save(out, "PNG")
                  out2 = pathlib.Path(f"android/app/src/main/res/mipmap-{dpi}/ic_launcher_round.png")
                  im.save(out2, "PNG")
                  print(f"icon {dpi} {px} done")
          else:
              print("no icon found")
          PY
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cpns-tryout-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
